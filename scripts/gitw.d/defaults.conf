# gitw defaults — override at ~/.config/gitw/config or <repo>/.gitw/config
# Syntax: key = value   (or key: value). Lines starting with # are comments.

# status
status.commits_limit = 3
status.pr = yes

# diff
diff.format = diff
diff.exclude_patterns =
diff.grouped_stats_collapse_above = 5

# lock retry (gitw_git executor) — see gitw.d/exec.sh
lock_retry.enabled = yes
lock_retry.max_retries = 4
lock_retry.stale_threshold_seconds = 10

# tree (app_manager) — space-separated paths relative to GITW_APP_ROOT
managed_repos = servo_src/servo chromium_src/src depot_tools
